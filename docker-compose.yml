services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: fawal-trading:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Server-only. Never prefix these with NEXT_PUBLIC_, which would publish
      # the bot token to every visitor.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:?set TELEGRAM_ADMIN_CHAT_ID in .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/ar').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
